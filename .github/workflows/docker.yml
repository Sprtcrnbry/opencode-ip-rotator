name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract proxy metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sprtcrnbry/opencode-ip-rotator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host test dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (rate limits + fingerprint headers)
        run: python -m unittest discover -s tests -v

      - name: Pull published image from GHCR
        run: docker pull ghcr.io/sprtcrnbry/opencode-ip-rotator:latest

      - name: Verify warp-cli binary and dependencies in image
        run: |
          docker run --rm --entrypoint '' ghcr.io/sprtcrnbry/opencode-ip-rotator:latest \
            sh -c "which warp-cli && warp-cli --version && python -c \"import server, rotator; print('imports ok')\""

      - name: Smoke-test proxy health endpoint
        run: |
          docker run -d --name ci-app -p 18000:8000 \
            -e OPENCODE_ZEN_HOST=0.0.0.0 \
            ghcr.io/sprtcrnbry/opencode-ip-rotator:latest
          ok=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:18000/metrics >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::proxy smoketest failed — dumping container logs"
            docker logs ci-app || true
            exit 1
          fi
          echo "proxy smoketest ok"
