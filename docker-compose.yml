services:
  opencode-ip-rotator:
    image: ghcr.io/sprtcrnbry/opencode-ip-rotator:latest
    container_name: opencode_ip_rotator
    ports:
      - "8000:8000"
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/app/data
      - ./proxies.txt:/app/data/proxies.txt:ro
    restart: unless-stopped
    environment:
      - OPENCODE_ZEN_PORT=8000
      - OPENCODE_ZEN_HOST=0.0.0.0
      - OPENCODE_ZEN_TARGET_BASE=https://opencode.ai/zen/v1
      - WARP_CHECK_ENDPOINT=https://opencode.ai
      - WARP_CHECK_INTERVAL=15
      - WARP_ROTATION_INTERVAL=300
      - METRICS_DB_PATH=/app/data/metrics.db
      - PROXY_LIST_FILE=/app/data/proxies.txt
      - PROXY_LIST=${PROXY_LIST:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
